[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patch-pilot-ai"
version = "0.1.0"
description = "Autonomous code healing and bug patching agent powered by Google Gemini."
readme = "README.md"
authors = [{ name = "Shubhransh Gupta" }]
license = { text = "MIT" }
keywords = [
    "swe-agent",
    "bug-fixer",
    "gemini",
    "ai-agent",
    "autonomous-agent",
    "self-healing",
    "automated-testing",
    "git",
    "python",
    "code-generation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "google-genai>=3.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
patch-pilot = "patch_pilot.cli:main"

[tool.setuptools.packages.find]
include = ["patch_pilot*"]
