<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .bar { fill: #161b22; }
      .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; font-weight: 500; }
      .text { font-family: "SF Mono", "Fira Code", Menlo, monospace; font-size: 13.5px; fill: #e6edf3; }
      .prompt { fill: #30d158; font-weight: 600; }
      .cmd { fill: #f0f6fc; font-weight: 500; }
      .dim { fill: #7d8590; }
      .accent { fill: #58a6ff; }
      .green { fill: #3fb950; font-weight: 600; }
      .red { fill: #f85149; font-weight: 600; }
      .yellow { fill: #d29922; }

      @keyframes pfade1 { 0%, 5% { opacity: 0; } 10%, 100% { opacity: 1; } }
      @keyframes pfade2 { 0%, 18% { opacity: 0; } 25%, 100% { opacity: 1; } }
      @keyframes pfade3 { 0%, 35% { opacity: 0; } 42%, 100% { opacity: 1; } }
      @keyframes pfade4 { 0%, 55% { opacity: 0; } 62%, 100% { opacity: 1; } }
      @keyframes pfade5 { 0%, 75% { opacity: 0; } 82%, 100% { opacity: 1; } }
      @keyframes pfade6 { 0%, 88% { opacity: 0; } 94%, 100% { opacity: 1; } }

      .pline1 { animation: pfade1 12s infinite; }
      .pline2 { animation: pfade2 12s infinite; }
      .pline3 { animation: pfade3 12s infinite; }
      .pline4 { animation: pfade4 12s infinite; }
      .pline5 { animation: pfade5 12s infinite; }
      .pline6 { animation: pfade6 12s infinite; }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="850" height="480" class="bg" />
  
  <!-- Header Bar -->
  <path d="M0 12C0 5.373 5.373 0 12 0h826c6.627 0 12 5.373 12 12v32H0V12z" class="bar" />
  <circle cx="24" cy="22" r="6" fill="#ff5f56" />
  <circle cx="44" cy="22" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="22" r="6" fill="#27c93f" />
  <text x="425" y="27" text-anchor="middle" class="title">patch-pilot &mdash; bash &mdash; 85x24</text>

  <!-- Terminal Content -->
  <g transform="translate(30, 75)" class="text">
    <!-- Command Line -->
    <text y="0">
      <tspan class="prompt">$ </tspan>
      <tspan class="cmd">patch-pilot "Fix KeyError when parsing optional config headers in client.py"</tspan>
    </text>

    <!-- Line 1: Startup Banner -->
    <g class="pline1" transform="translate(0, 36)">
      <text y="0" class="green">🤖 Patch Pilot &bull; Autonomous Test-Driven Code Healing Agent</text>
      <text y="24" class="dim">[*] Repo: . | Provider: CLAUDE | Model: claude-3-5-sonnet | Max Attempts: 4</text>
    </g>

    <!-- Line 2: Recon & Initial Test Run -->
    <g class="pline2" transform="translate(0, 96)">
      <text y="0" class="yellow">[*] Scanning repo tree... Auto-detected test runner: `pytest`</text>
      <text y="24" class="red">❌ Initial test run failed: KeyError: 'authorization' in client.py:42</text>
    </g>

    <!-- Line 3: Diagnosis & Patching -->
    <g class="pline3" transform="translate(0, 156)">
      <text y="0" class="accent">[*] Healing iteration 1/4: Analyzing error traceback &amp; AST...</text>
      <text y="24" class="dim">  &bull; Target candidate: src/client.py</text>
      <text y="48" class="dim">  &bull; Applied patch: safely retrieve headers with `.get("authorization")` fallback</text>
    </g>

    <!-- Line 4: Re-running Tests -->
    <g class="pline4" transform="translate(0, 240)">
      <text y="0" class="yellow">[*] Re-executing test suite (`pytest tests/test_client.py`)...</text>
      <text y="24" class="green">✅ tests/test_client.py::test_missing_header PASSED [100%]</text>
      <text y="48" class="green">✅ 14 passed in 0.38s &mdash; All tests green!</text>
    </g>

    <!-- Line 5: Git Branch & Commit -->
    <g class="pline5" transform="translate(0, 324)">
      <text y="0" class="accent">[*] Git Automation: Created branch `fix/patch-pilot-keyerror-config`</text>
      <text y="24" class="cmd">  &bull; Staged and committed: <tspan class="dim">"fix: safely handle missing optional authorization header"</tspan></text>
    </g>

    <!-- Line 6: Summary -->
    <g class="pline6" transform="translate(0, 384)">
      <text y="0" class="green">✨ RESOLVED &amp; VERIFIED &bull; Self-healing successful in 1 attempt.</text>
    </g>
  </g>
</svg>
